<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0f7a6c">
  <title>Penawaran</title>
  <link rel="icon" href="img/origara.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    /* Link pelanggan TANPA akun (v0.7.0). Pelanggan dikenali dari kode link rahasia (?k=...).
       Hanya untuk MELIHAT: Surat Penawaran dari kami (bisa dicetak / simpan PDF), status, dan progres produksi. */
    :root {
      --bg: #f2f5f4; --card: #ffffff; --soft: #f6f8f8; --line: #e1e7e6; --ink: #0e1a19; --ink-2: #4a5a58; --ink-3: #849391;
      --brand: #0f7a6c; --brand-2: #14a08a; --brand-soft: #e2f3ef; --gold: #f6b93b; --on-brand: #fff;
      --ok: #05875f; --ok-soft: #e3f6ee; --warn: #b45309; --warn-soft: #fdf2dc; --bad: #d92d20; --bad-soft: #fdeceb;
      --shadow: 0 1px 2px rgba(14,26,25,.04), 0 12px 30px -16px rgba(14,26,25,.18);
      --ease: cubic-bezier(.2,.8,.2,1);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0a1110; --card: #121b1a; --soft: #172322; --line: #233331; --ink: #e9f2f0; --ink-2: #aebfbc; --ink-3: #758784;
        --brand: #3cc9a8; --brand-2: #62d9bc; --brand-soft: #10302a; --on-brand: #04140f;
        --ok: #34d399; --ok-soft: #0f2c24; --warn: #fbbf24; --warn-soft: #2f2510; --bad: #ff7b72; --bad-soft: #351716;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -16px rgba(0,0,0,.6);
        color-scheme: dark;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; font: 500 15px/1.5 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); background: var(--bg); min-height: 100dvh; -webkit-font-smoothing: antialiased; }
    h1, h2, p { margin: 0; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; letter-spacing: -.02em; }
    .wrap { max-width: 860px; margin: 0 auto; padding: clamp(16px, 3vw, 32px) 16px 48px; }
    header.top { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    header.top img { width: 48px; height: 48px; object-fit: contain; border-radius: 12px; flex: none; }
    header.top b { display: block; font-size: 17px; font-weight: 800; line-height: 1.25; }
    header.top small { color: var(--ink-3); font-weight: 600; font-size: 13px; }
    .hello { background: linear-gradient(135deg, #0f7a6c, #0b5e55); color: #fff; border-radius: 20px; padding: 20px 22px; margin-bottom: 16px; position: relative; overflow: hidden; }
    .hello::after { content: ''; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; border: 18px solid rgba(255,255,255,.08); }
    .hello small { display: inline-flex; gap: 6px; align-items: center; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
    .hello small::before { content: ''; width: 14px; height: 2px; background: var(--gold); border-radius: 2px; }
    .hello h1 { font-size: clamp(20px, 3vw, 26px); font-weight: 800; letter-spacing: -.02em; margin-top: 4px; }
    .hello p { opacity: .85; font-size: 14px; margin-top: 4px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: clamp(16px, 2.6vw, 24px); box-shadow: var(--shadow); }
    .sec-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .sec-h h2 { font-size: 16px; font-weight: 800; display: flex; gap: 10px; align-items: center; }
    .sec-h h2 i { color: var(--brand); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; transition: transform .15s var(--ease), background .2s, border-color .2s; -webkit-tap-highlight-color: transparent; }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .5; cursor: wait; }
    .btn.pri { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
    .btn.pri:hover { background: var(--brand-2); }
    .msg { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; font-size: 14px; }
    .msg > i { font-size: 20px; margin-top: 1px; }
    .msg > div > b { display: block; font-size: 15px; }
    .msg.bad { background: var(--bad-soft); color: var(--bad); }
    .hint { font-size: 12.5px; color: var(--ink-3); }
    .order { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; box-shadow: var(--shadow); animation: in .3s var(--ease); }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } }
    .order-h { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
    .order-h b { font-size: 15px; }
    .order-h small { display: block; color: var(--ink-3); font-size: 12.5px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px; font-size: 12px; font-weight: 800; white-space: nowrap; background: var(--soft); color: var(--ink-2); flex: none; }
    .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill.Menunggu { background: var(--warn-soft); color: var(--warn); }
    .pill.Disetujui { background: var(--ok-soft); color: var(--ok); }
    .pill.Ditolak { background: var(--bad-soft); color: var(--bad); }
    .lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; color: var(--ink-2); }
    .lines li { display: flex; justify-content: space-between; gap: 10px; border-top: 1px dashed var(--line); padding-top: 4px; }
    .lines li:first-child { border-top: 0; padding-top: 0; }
    .lines li b { white-space: nowrap; }
    .total { display: flex; justify-content: space-between; align-items: center; font-weight: 800; padding-top: 6px; border-top: 1px solid var(--line); }
    .total span { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
    .bar { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; border: 1px solid var(--line); margin-top: 4px; }
    .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--brand-2)); border-radius: 99px; transition: width .6s var(--ease); }
    .acts { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .empty { text-align: center; padding: 40px 16px; color: var(--ink-3); }
    .empty i { font-size: 36px; opacity: .5; display: block; margin-bottom: 12px; }
    .empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
    .skel { height: 120px; border-radius: 16px; background: linear-gradient(90deg, var(--soft) 25%, var(--line) 50%, var(--soft) 75%); background-size: 200% 100%; animation: sh 1.2s linear infinite; }
    @keyframes sh { to { background-position: -200% 0; } }
    footer { text-align: center; color: var(--ink-3); font-size: 12.5px; margin-top: 28px; }
    @media (max-width: 480px) { .order-h { flex-direction: column-reverse; gap: 6px; } .acts .btn { width: 100%; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
<div class="wrap">
  <header class="top"><img id="logo" src="img/origara.png" alt=""><div><b id="comp">Penawaran</b><small id="compSub">Portal pelanggan</small></div></header>

  <div id="app" hidden>
    <section class="hello">
      <small>Penawaran untuk</small>
      <h1 id="custName"></h1>
      <p>Lihat dan unduh Surat Penawaran dari kami, serta pantau status pesanan Anda. Simpan link ini, jangan dibagikan ke pihak lain.</p>
    </section>
    <div class="sec-h"><h2><i class="fa-solid fa-file-signature"></i> Surat Penawaran</h2><button type="button" class="btn" id="reload"><i class="fa-solid fa-rotate"></i> Muat ulang</button></div>
    <div id="list" style="display:grid;gap:12px"></div>
  </div>

  <div id="loading" style="display:grid;gap:14px"><div class="skel" style="height:110px"></div><div class="skel"></div></div>
  <div id="fatal" hidden></div>
  <footer id="foot">Powered by Origara</footer>
</div>

<script src="js/config.js"></script>
<script src="js/sertifikat.js"></script>
<script src="js/penawaran-cetak.js"></script>
<script>
(function () {
  'use strict';
  const CONFIG = window.COA_CONFIG || {};
  const Q = new URLSearchParams(location.search);
  const UJI = Q.has('uji');
  const KEY = (Q.get('k') || '').trim().toLowerCase();
  const $ = (s, r = document) => r.querySelector(s);
  const e = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => Number(n || 0).toLocaleString('id-ID');
  const rp = n => 'Rp ' + Math.round(Number(n || 0)).toLocaleString('id-ID');
  const dmy = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso || ''); };
  let orders = null;

  function loadScript(src) {
    return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('Gagal memuat ' + src)); document.head.appendChild(s); });
  }
  async function api(action, ...args) {
    const req = { action, args: [KEY, ...args] };
    let res;
    if (UJI) { if (!window.COA_MOCK) await loadScript('../uji/pglite-mock.js'); res = await window.COA_MOCK(req); }
    else if (CONFIG.SUPABASE_URL) {
      let r;
      try {
        r = await fetch(CONFIG.SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/rpc/coa_api', {
          method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CONFIG.SUPABASE_KEY }, body: JSON.stringify({ req }) });
      } catch (x) { throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet Anda.'); }
      res = await r.json();
    } else throw new Error('Portal belum terhubung ke server.');
    if (!res || !res.ok) throw new Error((res && res.error) || 'Terjadi kesalahan.');
    return res.data;
  }
  const msg = (type, icon, title, text) => `<div class="msg ${type}"><i class="fa-solid ${icon}"></i><div><b>${e(title)}</b>${text ? `<span>${text}</span>` : ''}</div></div>`;
  function fatal(text) {
    $('#app').hidden = true; $('#loading').hidden = true; $('#fatal').hidden = false;
    $('#fatal').innerHTML = `<div class="card">${msg('bad', 'fa-link-slash', 'Link tidak bisa dipakai', e(text))}</div>`;
  }

  const LABEL = { Menunggu: 'Menunggu persetujuan Anda', Disetujui: 'Disetujui', Ditolak: 'Ditolak' };
  function orderHTML(s) {
    const pr = s.progres || { target: 0, selesai: 0, dikirim: 0 };
    const pct = pr.target ? Math.min(100, Math.round(pr.selesai * 100 / pr.target)) : 0;
    return `<article class="order" data-no="${e(s.no)}">
      <div class="order-h"><div><b class="mono">${e(s.no)}</b><small>${e(dmy(s.tanggal))}${s.perihal ? ' · ' + e(s.perihal) : ''}${s.berlaku && s.status === 'Menunggu' ? ' · berlaku s/d ' + e(dmy(s.berlaku)) : ''}</small></div>
        <span class="pill ${e(s.status)}">${e(LABEL[s.status] || s.status)}</span></div>
      <ul class="lines">${s.items.map(i => `<li><span>${e(i.deskripsi)} · ${e(i.warna)} · ${e(i.ukuran)} · ${fmt(i.qty)} × ${rp(i.harga)}</span><b>${rp(i.jumlah)}</b></li>`).join('')}</ul>
      <div class="total"><span>Total termasuk PPN ${e(s.tarifPpn)}%</span>${rp(s.total)}</div>
      ${s.status === 'Disetujui' ? `<div><small class="hint">No. PO ${e(s.noPO)} · produksi ${fmt(pr.selesai)} / ${fmt(pr.target)} pcs · dikirim ${fmt(pr.dikirim)} pcs</small><div class="bar"><i style="width:${pct}%"></i></div></div>` : ''}
      ${s.status === 'Ditolak' && s.alasan ? `<small class="hint">Catatan: ${e(s.alasan)}</small>` : ''}
      ${s.status === 'Menunggu' ? '<small class="hint">Bila setuju, silakan konfirmasi ke kontak kami. Pesanan akan langsung kami proses.</small>' : ''}
      <div class="acts"><button type="button" class="btn pri" data-print><i class="fa-solid fa-file-pdf"></i> Lihat / unduh PDF</button></div>
    </article>`;
  }
  function render() {
    const list = orders || [];
    $('#list').innerHTML = list.length ? list.map(orderHTML).join('')
      : '<div class="card empty"><i class="fa-solid fa-file-signature"></i><b>Belum ada penawaran</b>Surat Penawaran dari kami akan muncul di sini.</div>';
  }
  async function load(btn) {
    if (btn) btn.disabled = true;
    try { orders = await api('linkList'); render(); }
    catch (x) { $('#list').innerHTML = msg('bad', 'fa-circle-exclamation', x.message); }
    finally { if (btn) btn.disabled = false; }
  }
  async function printPNW(no, btn) {
    let w = null;
    try { w = window.open('', '_blank'); } catch (x) { w = null; }
    if (w) w.document.write('<p style="font:16px Arial;padding:24px">Menyiapkan dokumen…</p>');
    btn.disabled = true;
    try { COA_PNW.print(await api('linkPNW', no), w); }
    catch (x) { if (w) w.close(); alert(x.message); }
    finally { btn.disabled = false; }
  }

  async function start() {
    if (!/^[0-9a-f]{64}$/.test(KEY)) return fatal('Alamat link tidak lengkap. Buka lagi link yang Anda terima, atau hubungi kami.');
    let info;
    try { info = await api('linkInfo'); } catch (x) { return fatal(x.message); }
    const p = info.perusahaan || {};
    if (p.nama) { $('#comp').textContent = p.nama; document.title = 'Penawaran · ' + p.nama; $('#foot').textContent = `© ${new Date().getFullYear()} ${p.nama} · Powered by Origara`; }
    if (p.telp || p.email) $('#compSub').textContent = [p.telp, p.email].filter(Boolean).join(' · ');
    if (info.logo) $('#logo').src = info.logo;
    $('#custName').textContent = info.pelanggan.nama;
    $('#loading').hidden = true; $('#app').hidden = false;
    $('#list').innerHTML = '<div class="skel"></div>';
    load();
  }

  $('#reload').onclick = ev => load(ev.currentTarget);
  $('#list').addEventListener('click', ev => { const b = ev.target.closest('[data-print]'); if (b) printPNW(b.closest('[data-no]').dataset.no, b); });
  start();
})();
</script>
</body>
</html>
